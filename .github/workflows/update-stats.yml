name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make sure assets folder exists
        run: mkdir -p assets

      # Each card is fetched to a temp file first. If the fetch fails
      # (service down, rate-limited, etc.) the old committed SVG is kept
      # instead of being overwritten with a broken/empty file.

      - name: Fetch GitHub Stats card
        run: |
          if curl -sfL "https://github-readme-stats-lac-mu-41.vercel.app/api?username=kirillchacha&theme=blueberry&show_icons=true&hide_border=true" -o assets/stats.svg.tmp; then
            mv assets/stats.svg.tmp assets/stats.svg
          else
            echo "Stats card fetch failed, keeping previous version"
            rm -f assets/stats.svg.tmp
          fi

      - name: Fetch Top Languages card
        run: |
          if curl -sfL "https://github-readme-stats-lac-mu-41.vercel.app/api/top-langs/?username=kirillchacha&theme=blueberry&show_icons=true&hide_border=true&layout=compact" -o assets/top-langs.svg.tmp; then
            mv assets/top-langs.svg.tmp assets/top-langs.svg
          else
            echo "Top Languages card fetch failed, keeping previous version"
            rm -f assets/top-langs.svg.tmp
          fi

      - name: Fetch Streak card
        run: |
          if curl -sfL "https://streak-stats.demolab.com/?user=kirillchacha&theme=blueberry&hide_border=true" -o assets/streak.svg.tmp; then
            mv assets/streak.svg.tmp assets/streak.svg
          else
            echo "Streak card fetch failed, keeping previous version"
            rm -f assets/streak.svg.tmp
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "Update profile stats cards"
          git push
